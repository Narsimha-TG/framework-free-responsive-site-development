<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>System Dashboard | Framework-Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen overflow-x-hidden">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-2xl font-bold">System Monitor</h1>
            <div id="status-badge" class="px-4 py-1 rounded-full bg-green-50 text-green-700 border border-green-200 text-sm font-medium">🟢 Operational (Standby Demo)</div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-12 gap-6">
            <section class="md:col-span-8 bg-gray-50 p-6 rounded-xl border border-gray-100">
                <h2 class="text-lg font-semibold mb-4">Live Metrics</h2>
                <div id="metrics-chart" class="h-48 flex items-end gap-2">
                    <div class="w-full bg-blue-500 animate-pulse-slow" style="height: 40%"></div>
                    <div class="w-full bg-blue-400 animate-pulse-slow" style="height: 70%"></div>
                    <div class="w-full bg-blue-600 animate-pulse-slow" style="height: 50%"></div>
                    <div class="w-full bg-blue-500 animate-pulse-slow" style="height: 90%"></div>
                </div>
            </section>

            <section class="md:col-span-4 bg-gray-50 p-6 rounded-xl border border-gray-100">
                <h2 class="text-lg font-semibold mb-4">Control Panel</h2>
                <button onclick="submitAction()" class="w-full min-h-[44px] bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">Execute System Sync</button>
            </section>

            <section class="md:col-span-12 bg-gray-50 p-6 rounded-xl border border-gray-100">
                <h2 class="text-lg font-semibold mb-4">Activity Log</h2>
                <div id="log-feed" class="space-y-3"></div>
            </section>
        </main>
    </div>

    <script>
        const logs = [
            { id: 1, title: "System initialized", timestamp: "10:01 AM" },
            { id: 2, title: "API handshake established", timestamp: "10:02 AM" },
            { id: 3, title: "Data stream active", timestamp: "10:03 AM" },
            { id: 4, title: "Analytics sync complete", timestamp: "10:05 AM" }
        ];

        function renderLogs() {
            const container = document.getElementById('log-feed');
            container.innerHTML = logs.map(l => `
                <div class="flex justify-between p-3 bg-white rounded border border-gray-200">
                    <span class="text-gray-700">${l.title}</span>
                    <span class="text-sm text-gray-400">${l.timestamp}</span>
                </div>
            `).join('');
        }

        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                if (!res.ok) throw new Error();
            } catch (e) {
                document.getElementById('status-badge').innerText = '🟢 Operational (Standby Demo)';
            }
        }

        async function submitAction() {
            alert('Action triggered: Syncing data...');
            fetch('/api/contact', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'sync', timestamp: new Date().toISOString() }) 
            }).catch(() => {});
        }

        renderLogs();
        checkHealth();
    </script>
</body>
</html>
